# Publish to GitHub Pages — but only from a green tree.
#
# The whole test suite runs first, including the solvers: this game's one
# unbreakable promise is that every level it ships can be finished, and the
# only way that promise survives contact with a busy afternoon is if nothing
# reaches a player without the solvers agreeing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Bütün testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testler (tarayıcısız)
        run: node tools/test.mjs --no-browser --verbose

  deploy:
    name: Yayına al
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tek dosya sürümünü üret
        run: node tools/bundle.mjs dist/pengu.html
      # `enablement` turns Pages on through the API rather than requiring
      # somebody to find the setting in the web interface first.
      #
      # Without it this step had failed on every single push — thirty-two runs,
      # all of them green through the whole test suite and then dead one line
      # later on "Get Pages site failed ... Not Found", which is what the API
      # says when Pages has never been switched on for the repository. The
      # tests were passing and nothing was ever published, which is the worst
      # shape a deploy can have: it looks fine from the commit list.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
